name: Michi brand QA cleanup

on:
  push:
    paths:
      - '.github/workflows/michi-brand-qa.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Remove fruit remnants and clean icon edge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          text_paths = [
              'app.js', 'style.css', 'michi.js', 'michi.css', 'michi-ui.css',
              'index.html', 'manifest.json', 'service-worker.js', 'data/data.js', 'data/db.js'
          ]

          for rel in text_paths:
              p = root / rel
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('🍓', '✦')
              text = text.replace('Strawberry Milk', 'Sakura Path')
              p.write_text(text, encoding='utf-8')

          # Public UI/cache version bump so installed PWAs cannot keep the old fruit-marked shell.
          for rel in ['index.html', 'service-worker.js']:
              p = root / rel
              text = p.read_text(encoding='utf-8')
              text = text.replace('20260815-michi-redesign-1', '20260815-michi-brandfix-2')
              text = text.replace('apple-touch-icon-v41.png', 'apple-touch-icon-v42.png')
              text = text.replace('icon-192-v41.png', 'icon-192-v42.png')
              text = text.replace('icon-512-v41.png', 'icon-512-v42.png')
              text = text.replace('icon-maskable-512-v41.png', 'icon-maskable-512-v42.png')
              p.write_text(text, encoding='utf-8')

          p = root / 'manifest.json'
          text = p.read_text(encoding='utf-8')
          text = text.replace('apple-touch-icon-v41.png', 'apple-touch-icon-v42.png')
          text = text.replace('icon-192-v41.png', 'icon-192-v42.png')
          text = text.replace('icon-512-v41.png', 'icon-512-v42.png')
          text = text.replace('icon-maskable-512-v41.png', 'icon-maskable-512-v42.png')
          p.write_text(text, encoding='utf-8')

          p = root / 'service-worker.js'
          text = p.read_text(encoding='utf-8')
          text = text.replace('michi-shell-v1-redesign', 'michi-shell-v2-brandfix')
          p.write_text(text, encoding='utf-8')

          p = root / 'michi.js'
          text = p.read_text(encoding='utf-8').replace('const MICHI_UI_VERSION = "1.0.0";', 'const MICHI_UI_VERSION = "1.0.1";')
          p.write_text(text, encoding='utf-8')

          # Preserve the exact Michi artwork. Only remove a ~0.8% sliver from the left,
          # which contains the accidental dark edge, then resample back to full size.
          master_path = root / 'icons/icon-512-v41.png'
          master = Image.open(master_path).convert('RGBA')
          if master.size != (512, 512):
              raise RuntimeError(f'Unexpected Michi master size: {master.size}')

          crop_px = 4
          fixed = master.crop((crop_px, 0, 512, 512)).resize((512, 512), Image.Resampling.LANCZOS)

          # Extra guard: the Michi art is pastel, so a near-black pixel at the first few
          # columns can only be the edge artifact. Replace only those pixels from a nearby
          # interior sample; never touch the actual artwork away from the edge.
          px = fixed.load()
          repaired = 0
          for y in range(512):
              for x in range(5):
                  r,g,b,a = px[x,y]
                  nr,ng,nb,na = px[min(x+8,511),y]
                  lum = (r*299 + g*587 + b*114) / 1000
                  nlum = (nr*299 + ng*587 + nb*114) / 1000
                  if a > 0 and lum < 135 and nlum - lum > 30:
                      px[x,y] = (nr,ng,nb,na)
                      repaired += 1

          targets = [
              ('icons/apple-touch-icon-v42.png', 180),
              ('icons/apple-touch-icon.png', 180),
              ('icons/icon-192-v42.png', 192),
              ('icons/icon-192.png', 192),
              ('icons/icon-512-v42.png', 512),
              ('icons/icon-512.png', 512),
              ('icons/icon-maskable-512-v42.png', 512),
              ('icons/icon-maskable-512.png', 512),
          ]
          for rel, size in targets:
              out = fixed if size == 512 else fixed.resize((size,size), Image.Resampling.LANCZOS)
              out.save(root / rel, 'PNG', optimize=True)
              check = Image.open(root / rel)
              if check.size != (size,size):
                  raise RuntimeError(f'Bad output size for {rel}: {check.size}')
              print(rel, check.size, (root/rel).stat().st_size)

          # Old versioned icon filenames are obsolete after references move to v42.
          for rel in [
              'icons/apple-touch-icon-v41.png', 'icons/icon-192-v41.png',
              'icons/icon-512-v41.png', 'icons/icon-maskable-512-v41.png'
          ]:
              (root / rel).unlink(missing_ok=True)

          # Assertions for the exact issues caught in device QA.
          source_text = '\n'.join((root/p).read_text(encoding='utf-8') for p in text_paths if (root/p).exists())
          if '🍓' in source_text:
              raise RuntimeError('A strawberry emoji is still present in production text sources')
          if 'v41.png' in (root/'index.html').read_text(encoding='utf-8'):
              raise RuntimeError('index.html still references v41 icons')
          if 'v41.png' in (root/'manifest.json').read_text(encoding='utf-8'):
              raise RuntimeError('manifest.json still references v41 icons')
          if 'v41.png' in (root/'service-worker.js').read_text(encoding='utf-8'):
              raise RuntimeError('service-worker.js still references v41 icons')
          print('edge pixels repaired:', repaired)
          print('Michi brand QA assertions passed')
          PY

      - name: Static validation
        run: |
          node --check app.js
          node --check michi.js
          node --check service-worker.js
          python3 -m json.tool manifest.json >/dev/null
          grep -R --line-number --fixed-strings '🍓' index.html app.js style.css michi.js michi.css michi-ui.css manifest.json service-worker.js data || true
          if grep -R -q --fixed-strings '🍓' index.html app.js style.css michi.js michi.css michi-ui.css manifest.json service-worker.js data; then
            echo 'Strawberry remnant found' >&2
            exit 1
          fi

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/michi-brand-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove final fruit remnants and clean Michi icon edge'
          git push origin main
