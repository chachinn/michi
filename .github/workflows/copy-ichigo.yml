name: Copy Ichigo baseline

on:
  push:
    paths:
      - '.github/workflows/copy-ichigo.yml'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Michi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current Ichigo main
        run: git clone --depth 1 --branch main https://github.com/chachinn/ichigo.git /tmp/ichigo

      - name: Copy Ichigo files into Michi
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/ichigo/ ./

      - name: Commit exact baseline copy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Michi already matches Ichigo."
          else
            git commit -m "Copy current Ichigo main baseline"
            git push origin main
          fi

# Trigger one-time baseline copy
