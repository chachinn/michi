name: Install Michi icon

on:
  push:
    paths:
      - '.github/workflows/install-michi-icon.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Rebuild and resize Michi icon
        shell: bash
        run: |
          cat .github/icon-parts/part*.bin > /tmp/michi-icon-512.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('/tmp/michi-icon-512.png')
          im=Image.open(p)
          im.verify()
          im=Image.open(p).convert('RGBA')
          assert im.size == (512,512), im.size
          targets=[
            ('icons/apple-touch-icon-v41.png',180),
            ('icons/apple-touch-icon.png',180),
            ('icons/icon-192-v41.png',192),
            ('icons/icon-192.png',192),
            ('icons/icon-512-v41.png',512),
            ('icons/icon-512.png',512),
            ('icons/icon-maskable-512-v41.png',512),
            ('icons/icon-maskable-512.png',512),
          ]
          for path,size in targets:
            out=im if size==512 else im.resize((size,size),Image.Resampling.LANCZOS)
            out.save(path,'PNG',optimize=True)
            check=Image.open(path)
            assert check.size==(size,size), (path,check.size)
            print(path,check.size,Path(path).stat().st_size)
          PY

      - name: Remove one-time installer
        run: |
          rm -rf .github/icon-parts
          rm -f .github/workflows/install-michi-icon.yml

      - name: Commit icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Michi app icons'
          git push origin main
