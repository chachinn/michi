<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#d78f9b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Michi">
  <meta name="description" content="Michi — discover, plan, travel, and remember every step of the journey.">
  <meta name="application-name" content="Michi">
  <meta name="format-detection" content="telephone=no">
  <title>Michi 道</title>

  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-v41.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192-v41.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512-v41.png">
  <link rel="manifest" href="./manifest.json?v=20260815-michi-redesign-1">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./style.css?v=20260815-michi-redesign-1">
  <link rel="stylesheet" href="./michi.css?v=20260815-michi-redesign-1">
  <link rel="stylesheet" href="./michi-ui.css?v=20260815-michi-redesign-1">
</head>
<body>
  <a class="skip-link" href="#mainView">Skip to content</a>
  <div id="appShell" class="app-shell">
    <header class="topbar topbar-v8 michi-topbar">
      <button class="icon-btn menu-btn-v8" data-action="open-drawer-v8" aria-label="Open Michi menu" title="Menu">☰</button>
      <button class="brand brand-v8 michi-brand" data-action="go-home" aria-label="Go to Michi home">
        <span class="michi-brand-mark"><img src="./icons/icon-192-v41.png" alt=""></span>
        <span class="michi-wordmark"><strong>michi</strong><small>道</small></span>
      </button>
      <div class="top-actions top-actions-v8">
        <button class="icon-btn" data-action="open-search-v3" aria-label="Search your trip" title="Search">⌕</button>
        <button class="icon-btn install-icon-v8" id="installBtn" hidden title="Install Michi">↓</button>
      </div>
    </header>

    <div id="appUpdateHost" aria-live="polite"></div>

    <main id="mainView" class="main-view" aria-live="polite">
      <section id="michiBootScreen" class="boot-screen-v92 michi-boot">
        <div class="michi-boot-icon"><img src="./icons/icon-192-v41.png" alt=""></div>
        <strong>Opening Michi…</strong>
        <small>Getting your journey ready.</small>
        <div class="michi-boot-path" aria-hidden="true"><i></i><i></i><i></i></div>
      </section>
    </main>

    <nav id="bottomNavV8" class="bottom-nav bottom-nav-v8" aria-label="Main navigation"></nav>
    <button id="fab" class="fab" data-action="open-quick-add" aria-label="Quick add">＋</button>
  </div>

  <div id="drawerRootV8"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <template id="modalTemplate">
    <div class="modal-backdrop" data-action="close-modal">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-handle"></div>
        <div class="modal-head">
          <div><p class="eyebrow">MICHI · 道</p><h2 id="modalTitle">Michi</h2></div>
          <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </section>
    </div>
  </template>

  <script>
    window.__MICHI_BOOT_COMPLETE = false;
    window.__MICHI_BOOT_ERROR = null;

    function showMichiBootRecovery(error) {
      window.__MICHI_BOOT_ERROR = error || window.__MICHI_BOOT_ERROR;
      if (window.__MICHI_BOOT_COMPLETE) return;
      var main = document.getElementById('mainView');
      if (!main) return;
      main.innerHTML = '<section class="boot-recovery-v92 michi-recovery">' +
        '<img src="./icons/icon-192-v41.png" alt="">' +
        '<p class="eyebrow">MICHI RECOVERY</p>' +
        '<h1>Michi had trouble opening.</h1>' +
        '<p>Your local trip data has not been erased. Reload the app and try again.</p>' +
        '<button type="button" onclick="location.reload()">Reload Michi</button>' +
        '</section>';
    }

    window.addEventListener('error', function (event) {
      if (!window.__MICHI_BOOT_COMPLETE) {
        console.error('Michi startup error', event.error || event.message);
        setTimeout(function(){ showMichiBootRecovery(event.error || event.message); }, 0);
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      if (!window.__MICHI_BOOT_COMPLETE) {
        console.error('Michi startup rejection', event.reason);
        setTimeout(function(){ showMichiBootRecovery(event.reason); }, 0);
      }
    });
    setTimeout(function () {
      if (!window.__MICHI_BOOT_COMPLETE) showMichiBootRecovery(window.__MICHI_BOOT_ERROR);
    }, 4500);
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./data/data.js?v=20260815-michi-redesign-1"></script>
  <script src="./data/db.js?v=20260815-michi-redesign-1"></script>
  <script src="./app.js?v=20260815-michi-redesign-1"></script>
  <script src="./michi.js?v=20260815-michi-redesign-1"></script>
</body>
</html>
